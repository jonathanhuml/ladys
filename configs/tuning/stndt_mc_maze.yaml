base: ../experiment/real/mc_maze/stndt/stndt_mc_maze_nlb_5ms.yaml
objective:
  metric: co_bps
  mode: max
  checkpoint: best
evaluation_interval: 50
search_space:
  model.optimization.lr:
    distribution: loguniform
    low: 0.0001
    high: 0.01
  model.optimization.weight_decay:
    distribution: loguniform
    low: 0.00000001
    high: 0.001
  model.dropout:
    distribution: uniform
    low: 0.0
    high: 0.6
  model.mask_ratio:
    distribution: uniform
    low: 0.1
    high: 0.6
algorithm: tpe
num_samples: 20
include_base: true
training_seeds: [0, 1, 2]
search_seed: 7
resources:
  cpu: 4
  gpu: 1
max_concurrent_trials: 1
output_dir: studies
name: stndt_mc_maze
