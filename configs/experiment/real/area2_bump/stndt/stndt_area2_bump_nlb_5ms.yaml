dataset:
  name: area2_bump
  split: test
  bin_size_ms: 5
  data_path: data/real/nlb/area2_bump_test_5ms.h5
  input_mode: heldin
  include_forward: true

model:
  name: stndt
  objective: stndt_masked_poisson_nll
  ensemble: false
  ensemble_size: 2
  output_mode: auto
  context_forward: 80
  context_backward: 32
  context_wrap_initial: false
  full_context: false
  hidden_size: 128
  dropout: 0.15
  dropout_rates: 0.15
  dropout_embedding: 0.15
  num_heads: 1
  num_layers: 4
  activation: relu
  linear_embedder: true
  embed_dim: 1
  learnable_position: false
  max_spike_count: 20
  lograte: true
  log_rate_min: -8.0
  log_rate_max: 8.0
  spike_log_init: false
  fixup_init: true
  pre_norm: true
  scale_norm: false
  decoder_layers: 1
  position_offset: false
  mask_ratio: 0.3
  mask_mode: full
  mask_token_ratio: 0.8
  mask_random_ratio: 0.95
  mask_max_span: 1
  mask_span_expand_prob: 0.0
  mask_span_ramp_start: 600
  mask_span_ramp_end: 1200
  use_zero_mask: true
  topk_loss_fraction: 1.0
  do_contrast: true
  contrast_mask_ratio: 0.1
  contrast_mask_mode: full
  contrast_mask_token_ratio: 0.8
  contrast_mask_random_ratio: 0.7
  contrast_mask_max_span: 1
  contrast_mask_span_expand_prob: 0.0
  contrast_mask_span_ramp_start: 8000
  contrast_mask_span_ramp_end: 12000
  temperature: 0.07
  contrast_lambda: 0.3
  use_contrast_projector: false
  linear_projector: true
  contrast_layer: embedder
  nlb_decoder: direct
  optimization:
    name: gradient
    optimizer: AdamW
    lr: 0.0015
    weight_decay: 0.0001
    gradient_clip: 200.0
    lr_scheduler: warmup_cosine
    warmup_steps: 2500
    total_steps: 40001
    scheduler_step: epoch

preprocessing:
  observations: null

trainer:
  epochs: 5000
  batch_size: 64
  device: cpu

experiment:
  output_dir: runs
  run_name: stndt_area2_bump_nlb_5ms
  save_predictions: true
