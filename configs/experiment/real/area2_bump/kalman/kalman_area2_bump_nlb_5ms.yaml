dataset:
  name: area2_bump
  split: val
  bin_size_ms: 5
  max_trials: null

model:
  name: kalman
  objective: negative_log_marginal_likelihood
  dt: 0.005
  dataset_name: area2_bump
  save_model: false
  nlb_ridge_alpha: 500.0
  optimization:
    name: gradient
    optimizer: Adam
    lr: 1.0e-2
    weight_decay: 0.0
    gradient_clip: 300.0

preprocessing:
  observations:
    name: smooth_firing_rate
    sampling_precision: 5.0
    kern_sd_ms: 50.0

trainer:
  epochs: 20
  batch_size: 64
  device: cpu

experiment:
  output_dir: runs
  run_name: kalman_area2_bump_nlb_5ms
  save_predictions: true
