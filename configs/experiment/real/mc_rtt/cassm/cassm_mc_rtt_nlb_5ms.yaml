dataset:
  name: mc_rtt
  data_path: data/real/nlb/mc_rtt_test_5ms.h5
  split: test
  bin_size_ms: 5
  max_trials: null
  seed: 7

model:
  name: cassm
  objective: cassm_elbo
  projection_dim: 20
  dt: 0.005
  dataset_name: mc_rtt
  save_model: false
  use_dense_projection: true
  health_checks: true
  nlb_feature_source: latents
  nlb_decoder: ridge
  nlb_ridge_alpha: 200.0
  optimization:
    name: gradient
    optimizer: Adam
    lr: 5.0e-2
    weight_decay: 0.0
    gradient_clip: 300.0

preprocessing:
  observations:
    name: smooth_firing_rate
    sampling_precision: 5.0
    kern_sd_ms: 50.0

trainer:
  epochs: 20
  batch_size: 64
  device: cuda

experiment:
  output_dir: runs
  run_name: cassm_mc_rtt_nlb_5ms
  save_predictions: true
