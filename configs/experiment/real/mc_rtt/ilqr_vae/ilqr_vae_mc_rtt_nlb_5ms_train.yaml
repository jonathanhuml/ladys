dataset:
  name: mc_rtt
  split: val
  bin_size_ms: 5
  data_path: null
  max_trials: null

model:
  name: ilqr_vae
  objective: ilqr_vae_elbo
  initialization: random
  params_path: null
  template_params_path: null
  readout_bias_initialization: empirical_rates
  latent_dim: 20
  input_dim: 5
  init_seed: 0
  solver: ilqr
  max_iter: 5
  differentiate_controls: true
  trainable_parameters: true
  n_posterior_samples: 1
  include_elbo_constants: true
  dynamics_regularizer: 1.0e-5
  held_in_neurons: null
  output_neuron_start: null
  output_neurons: null
  dt: null
  optimization:
    name: gradient
    optimizer: Adam
    lr: 1.0e-3
    lr_scheduler: sqrt_decay
    sqrt_decay_scale: 1.0
    weight_decay: 0.0
    gradient_clip: 200.0

preprocessing:
  observations: null

trainer:
  epochs: 25
  batch_size: 2
  device: cpu

experiment:
  output_dir: runs
  run_name: ilqr_vae_mc_rtt_nlb_5ms_train
  save_predictions: true
