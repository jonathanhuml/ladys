dataset:
  name: allen_vcn_flash_fc_top
  data_path: data/real/allen_vcn/allen_vcn_low_trial_20ms.h5
  group: flash_fc_top
model:
  name: ndt
  objective: masked_poisson_nll
  output_neurons: 1006
  output_mode: auto
  fwd_steps: 0
  context_forward: 24
  context_backward: 24
  context_wrap_initial: false
  full_context: false
  hidden_size: 128
  dropout: 0.2
  dropout_rates: 0.2
  dropout_embedding: 0.2
  num_heads: 2
  num_layers: 4
  activation: relu
  linear_embedder: true
  embed_dim: 1
  learnable_position: true
  max_spike_count: 20
  lograte: true
  log_rate_min: -8.0
  log_rate_max: 8.0
  spike_log_init: false
  fixup_init: true
  pre_norm: true
  scale_norm: false
  decoder_layers: 1
  position_offset: true
  mask_ratio: 0.25
  mask_mode: full
  mask_token_ratio: 0.75
  mask_random_ratio: 0.9
  mask_max_span: 7
  mask_span_expand_prob: 0.0
  mask_span_ramp_start: 240
  mask_span_ramp_end: 360
  use_zero_mask: true
  topk_loss_fraction: 1.0
  nlb_decoder: direct
  optimization:
    name: gradient
    optimizer: AdamW
    lr: 0.001
    weight_decay: 5.0e-05
    gradient_clip: 200.0
    lr_scheduler: warmup_cosine
    warmup_steps: 150
    total_steps: 1500
    scheduler_step: epoch
preprocessing:
  observations: null
trainer:
  epochs: 1500
  batch_size: 64
  device: cuda
  live_eval_interval: 250
experiment:
  output_dir: runs/allen_vcn_nlb_style_20260805_tuned_core_v2
  run_name: ndt_allen_vcn_flash_fc_top_20ms_nlb_style
  save_predictions: true
