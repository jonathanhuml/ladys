dataset:
  name: allen_vcn_flash_fc_top
  data_path: data/real/allen_vcn/allen_vcn_low_trial_20ms.h5
  group: flash_fc_top
model:
  name: gpfa
  objective: negative_log_marginal_likelihood
  latent_dim: 32
  bin_width: 20.0
  start_tau: 100.0
  start_eps: 0.001
  min_var_frac: 0.01
  init_method: fa
  init_seed: 0
  learn_kernel_params: false
  fa_max_iters: 500
  fa_tol: 1.0e-08
  kernel_param_max_iters: 8
  kernel_param_lr: 1.0
  jitter: 1.0e-05
  optimization:
    name: inference_only
preprocessing:
  observations: null
trainer:
  epochs: 0
  batch_size: 4096
  device: cpu
  live_eval_interval: 0
experiment:
  output_dir: runs/allen_vcn_nlb_style_20260805_tuned_core_v2
  run_name: gpfa_allen_vcn_flash_fc_top_20ms_nlb_style
  save_predictions: true
