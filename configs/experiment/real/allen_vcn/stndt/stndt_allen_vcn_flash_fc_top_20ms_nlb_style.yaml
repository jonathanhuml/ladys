dataset:
  name: allen_vcn_flash_fc_top
  data_path: data/real/allen_vcn/allen_vcn_low_trial_20ms.h5
  group: flash_fc_top
model:
  name: stndt
  objective: stndt_masked_poisson_nll
  ensemble: false
  ensemble_size: 2
  output_mode: auto
  fwd_steps: 0
  context_forward: 24
  context_backward: 7
  context_wrap_initial: false
  full_context: false
  hidden_size: 128
  dropout: 0.3258805092088328
  dropout_rates: 0.3331559445029162
  dropout_embedding: 0.5567310695526302
  num_heads: 1
  num_layers: 4
  activation: relu
  linear_embedder: true
  embed_dim: 1
  learnable_position: false
  max_spike_count: 20
  lograte: true
  log_rate_min: -8.0
  log_rate_max: 8.0
  spike_log_init: false
  fixup_init: true
  pre_norm: true
  scale_norm: false
  decoder_layers: 1
  position_offset: false
  mask_ratio: 0.25473718401208967
  mask_mode: full
  mask_token_ratio: 0.8355074373250815
  mask_random_ratio: 0.8578455430626231
  mask_max_span: 5
  mask_span_expand_prob: 0.0
  mask_span_ramp_start: 8000
  mask_span_ramp_end: 12000
  use_zero_mask: true
  topk_loss_fraction: 1.0
  do_contrast: false
  contrast_mask_ratio: 0.16105417937781183
  contrast_mask_mode: full
  contrast_mask_token_ratio: 0.9925137916228178
  contrast_mask_random_ratio: 0.8592738189960607
  contrast_mask_max_span: 1
  contrast_mask_span_expand_prob: 0.0
  temperature: 0.07
  contrast_lambda: 0.5706354364772466
  use_contrast_projector: false
  linear_projector: true
  contrast_layer: embedder
  nlb_decoder: direct
  optimization:
    name: gradient
    optimizer: AdamW
    lr: 0.008249215636338611
    weight_decay: 0.00038970415504287285
    gradient_clip: 200.0
    lr_scheduler: warmup_cosine
    warmup_steps: 958
    total_steps: 3000
    scheduler_step: epoch
preprocessing:
  observations: null
trainer:
  epochs: 3000
  batch_size: 64
  device: cuda
  live_eval_interval: 500
experiment:
  output_dir: runs/allen_vcn_nlb_style_20260805_tuned_core_v2
  run_name: stndt_allen_vcn_flash_fc_top_20ms_nlb_style
  save_predictions: true
