dataset:
  name: allen_vcn_bo_drifting_one_tf
  data_path: data/real/allen_vcn/allen_vcn_low_trial_20ms.h5
  group: bo_drifting_one_tf
model:
  name: cassm
  objective: cassm_elbo
  projection_dim: 160
  dt: 0.02
  dataset_name: allen_vcn_bo_drifting_one_tf
  save_model: false
  use_dense_projection: true
  health_checks: true
  nlb_feature_source: predict_rates
  nlb_decoder: ridge
  nlb_ridge_alpha: 2000.0
  optimization:
    name: gradient
    optimizer: Adam
    lr: 0.05
    weight_decay: 0.0
    gradient_clip: 300.0
preprocessing:
  observations:
    name: smooth_firing_rate
    sampling_precision: 20.0
    kern_sd_ms: 50.0
trainer:
  epochs: 100
  batch_size: 64
  device: cuda
  live_eval_interval: 0
experiment:
  output_dir: runs/allen_vcn_nlb_style_20260805_tuned_core_v2/classical_fallback_sweep
  run_name: cassm_allen_vcn_bo_drifting_one_tf_20ms_nlb_style_fallback_pred_proj160_alpha2000
  save_predictions: true
