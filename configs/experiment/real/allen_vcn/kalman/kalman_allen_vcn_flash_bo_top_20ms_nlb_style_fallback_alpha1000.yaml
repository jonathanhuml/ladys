dataset:
  name: allen_vcn_flash_bo_top
  data_path: data/real/allen_vcn/allen_vcn_low_trial_20ms.h5
  group: flash_bo_top
model:
  name: kalman
  objective: negative_log_marginal_likelihood
  dt: 0.02
  dataset_name: allen_vcn_flash_bo_top
  save_model: false
  nlb_ridge_alpha: 1000.0
  optimization:
    name: inference_only
preprocessing:
  observations:
    name: smooth_firing_rate
    sampling_precision: 20.0
    kern_sd_ms: 50.0
trainer:
  epochs: 0
  batch_size: 64
  device: cpu
  live_eval_interval: 0
experiment:
  output_dir: runs/allen_vcn_nlb_style_20260805_tuned_core_v2/classical_fallback_sweep
  run_name: kalman_allen_vcn_flash_bo_top_20ms_nlb_style_fallback_alpha1000
  save_predictions: true
