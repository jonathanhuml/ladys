dataset:
  name: allen_vcn_flash_bo_top
  data_path: data/real/allen_vcn/allen_vcn_low_trial_20ms.h5
  group: flash_bo_top
model:
  name: lfads
  objective: lfads_elbo
  generator_dim: 200
  initial_condition_dim: 64
  inferred_input_dim: 4
  factor_dim: 100
  g0_encoder_dim: 64
  controller_encoder_dim: 64
  controller_dim: 64
  g0_prior_kappa: 0.1
  inferred_input_prior_kappa: 0.1
  inferred_input_prior: autoregressive
  inferred_input_prior_tau: 10.0
  keep_prob: 0.7
  clip_val: 5.0
  dt: 0.02
  log_rate_min: -8.0
  log_rate_max: 8.0
  posterior_logvar_min: -9.210340371976182
  posterior_logvar_max: 5.0
  controller_lag: 1
  reconstruction_time_steps: 25
  readout_neurons: 959
  output_neuron_start: 767
  output_neurons: 192
  use_log1p_encoder_inputs: false
  initialize_log_rate_bias: true
  prediction_samples: 1
  loss_scale: 10000.0
  reconstruction_reduce_mean: true
  coordinated_dropout_rate: 0.3
  coordinated_dropout_pass_rate: 0.0
  coordinated_dropout_ic_enc_seq_len: 0
  kl_weight_schedule_start: 0
  kl_weight_schedule_dur: 2880
  kl_g0_scale: 1.0e-07
  kl_u_scale: 1.0e-07
  l2_weight_schedule_start: 0
  l2_weight_schedule_dur: 2880
  l2_gen_scale: 0.0
  l2_con_scale: 0.0
  optimization:
    name: gradient
    optimizer: AdamW
    lr: 0.004
    weight_decay: 0.0
    gradient_clip: 200.0
preprocessing:
  observations: null
trainer:
  epochs: 100
  batch_size: 64
  device: cuda
  live_eval_interval: 10
experiment:
  output_dir: runs/allen_vcn_nlb_style_20260805_tuned_core_v2
  run_name: lfads_allen_vcn_flash_bo_top_20ms_nlb_style
  save_predictions: true
